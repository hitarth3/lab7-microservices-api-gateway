<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 880" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="registryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="dbAtlasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ed64" />
      <stop offset="100%" stop-color="#00684a" />
    </linearGradient>
    <linearGradient id="blockedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowPurple" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>

    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc" />
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f472b6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1150" height="880" fill="url(#bgGrad)" />

  <!-- Grid Accent Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="1150" y2="90" />
    <line x1="0" y1="290" x2="1150" y2="290" />
    <line x1="0" y1="670" x2="1150" y2="670" />
  </g>

  <!-- Title & Course Header -->
  <text x="575" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="0.5">CampusConnect Microservices Architecture (Lab 7)</text>
  <text x="575" y="68" text-anchor="middle" font-size="13.5" font-weight="500" fill="#94a3b8">API Gateway • Configuration-Based Service Discovery • Cloud Deployment (Render / Docker)</text>

  <!-- ========================================================================= -->
  <!-- TIER 1: CLIENT / PUBLIC INTERNET                                          -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="320" height="95" rx="14" fill="url(#clientGrad)" />
    <text x="160" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Client / Postman</text>
    <text x="160" y="58" text-anchor="middle" font-size="12" fill="#e0f2fe">Sends ALL requests to one public endpoint</text>
    <text x="160" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">http://localhost:8080 OR Cloud Gateway URL</text>
  </g>

  <!-- Client Traffic Arrow -> Gateway -->
  <path d="M 420 148 L 570 148" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" />
  <text x="495" y="136" text-anchor="middle" font-size="11.5" font-weight="600" fill="#38bdf8">Public REST Calls</text>

  <!-- ========================================================================= -->
  <!-- TIER 2: API GATEWAY & SERVICE DISCOVERY REGISTRY                          -->
  <!-- ========================================================================= -->
  <!-- API Gateway Box -->
  <g transform="translate(580, 100)" filter="url(#glowPurple)">
    <rect width="470" height="150" rx="16" fill="url(#gatewayGrad)" stroke="#c084fc" stroke-width="2" />
    <text x="235" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">API Gateway (api-gateway:v1)</text>
    <text x="235" y="54" text-anchor="middle" font-size="12.5" fill="#f3e8ff">Single Public Entry Point • Port :8080 (Published to Host/Internet)</text>
    
    <!-- Gateway Feature Pills -->
    <rect x="25" y="70" width="130" height="28" rx="8" fill="#581c87" />
    <text x="90" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#e9d5ff">GET /health</text>

    <rect x="165" y="70" width="140" height="28" rx="8" fill="#581c87" />
    <text x="235" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#e9d5ff">Structured Logging</text>

    <rect x="315" y="70" width="130" height="28" rx="8" fill="#581c87" />
    <text x="380" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#e9d5ff">502/503 Handling</text>

    <text x="235" y="125" text-anchor="middle" font-size="11.5" fill="#fdf4ff">
      Routes: <tspan fill="#34d399">/users/*</tspan> • <tspan fill="#fbbf24">/products/*</tspan> • <tspan fill="#f472b6">/orders/*</tspan>
    </text>
  </g>

  <!-- Service Registry / Config Box (Injected via Environment Variables) -->
  <g transform="translate(100, 215)" filter="url(#shadow)">
    <rect width="320" height="95" rx="12" fill="url(#registryGrad)" stroke="#67e8f9" stroke-width="1.5" />
    <text x="160" y="30" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Service Discovery (Config Layer)</text>
    <text x="160" y="52" text-anchor="middle" font-size="11" fill="#cffafe">USER_SERVICE_URL=http://user-service:3001</text>
    <text x="160" y="68" text-anchor="middle" font-size="11" fill="#cffafe">PRODUCT_SERVICE_URL=http://product-service:3002</text>
    <text x="160" y="84" text-anchor="middle" font-size="11" fill="#cffafe">ORDER_SERVICE_URL=http://order-service:3003</text>
  </g>

  <!-- Config arrow to gateway -->
  <path d="M 420 262 L 640 262 L 640 252" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-cyan)" />
  <text x="525" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#22d3ee">Loads Routing Table at Startup</text>

  <!-- ========================================================================= -->
  <!-- TIER 3: DOCKER BRIDGE NETWORK BOUNDARY (campus-network)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 340)">
    <!-- Container Network Boundary Box -->
    <rect width="1030" height="340" rx="18" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.95" />
    <rect x="25" y="-14" width="460" height="28" rx="6" fill="#1e3a8a" />
    <text x="255" y="5" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="0.5">
      🔒 DOCKER INTERNAL NETWORK: campus-network (Isolated from Direct Host Access)
    </text>

    <!-- Direct Access Prohibited Indicator -->
    <g transform="translate(560, -14)">
      <rect width="440" height="28" rx="6" fill="url(#blockedGrad)" />
      <text x="220" y="5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">
        ⛔ Ports 3001, 3002, 3003, 27017 UNEXPOSED to Outside
      </text>
    </g>

    <!-- 1. User Microservice -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="280" height="135" rx="14" fill="url(#userGrad)" stroke="#34d399" stroke-width="1.5" />
      <text x="140" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">User Service</text>
      <text x="140" y="52" text-anchor="middle" font-size="11.5" fill="#d1fae5">Container: user-service</text>
      <text x="140" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Internal Port: :3001 (expose)</text>
      <rect x="20" y="85" width="240" height="36" rx="6" fill="#064e3b" />
      <text x="140" y="102" text-anchor="middle" font-size="10.5" fill="#a7f3d0">Profile, Auth &amp; Identity Management</text>
      <text x="140" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">Owns DB: campus_users</text>
    </g>

    <!-- 2. Product Microservice -->
    <g transform="translate(375, 45)" filter="url(#shadow)">
      <rect width="280" height="135" rx="14" fill="url(#prodGrad)" stroke="#fcd34d" stroke-width="1.5" />
      <text x="140" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Product Service</text>
      <text x="140" y="52" text-anchor="middle" font-size="11.5" fill="#fef3c7">Container: product-service</text>
      <text x="140" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Internal Port: :3002 (expose)</text>
      <rect x="20" y="85" width="240" height="36" rx="6" fill="#78350f" />
      <text x="140" y="102" text-anchor="middle" font-size="10.5" fill="#fde68a">Campus Merchandise &amp; Textbook Catalog</text>
      <text x="140" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#fbbf24">Owns DB: campus_products</text>
    </g>

    <!-- 3. Order Microservice -->
    <g transform="translate(710, 45)" filter="url(#shadow)">
      <rect width="280" height="135" rx="14" fill="url(#orderGrad)" stroke="#f472b6" stroke-width="1.5" />
      <text x="140" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Order Service</text>
      <text x="140" y="52" text-anchor="middle" font-size="11.5" fill="#fce7f3">Container: order-service</text>
      <text x="140" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Internal Port: :3003 (expose)</text>
      <rect x="20" y="85" width="240" height="36" rx="6" fill="#831843" />
      <text x="140" y="102" text-anchor="middle" font-size="10.5" fill="#fbcfe8">Order Placement &amp; Orchestration</text>
      <text x="140" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#f472b6">Owns DB: campus_orders</text>
    </g>

    <!-- Inter-Service Order Communication Arrows inside Network -->
    <path d="M 750 180 C 750 240, 220 240, 220 180" stroke="#f472b6" stroke-width="2.5" fill="none" marker-end="url(#arrow-pink)" />
    <rect x="380" y="218" width="260" height="24" rx="6" fill="#1e1b4b" stroke="#f472b6" stroke-width="1" />
    <text x="510" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#f472b6">
      Internal REST: Order -> User (GET /users/{id}) &amp; Product (GET /products/{id})
    </text>
  </g>

  <!-- Gateway Proxy Routing Arrows into Docker Network -->
  <!-- Gateway -> User Service -->
  <path d="M 680 250 L 680 300 L 220 300 L 220 380" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)" />
  <text x="440" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Reverse Proxy /users/*</text>

  <!-- Gateway -> Product Service -->
  <path d="M 815 250 L 815 315 L 555 315 L 555 380" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)" />
  <text x="690" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Reverse Proxy /products/*</text>

  <!-- Gateway -> Order Service -->
  <path d="M 950 250 L 950 380" stroke="#f472b6" stroke-width="2.5" fill="none" marker-end="url(#arrow-pink)" />
  <text x="960" y="310" text-anchor="start" font-size="11" font-weight="600" fill="#f472b6">Reverse Proxy /orders/*</text>

  <!-- ========================================================================= -->
  <!-- TIER 4: PERSISTENT STORAGE (MONGODB ATLAS & LOCAL DATA VOLUME)            -->
  <!-- ========================================================================= -->
  <g transform="translate(180, 715)" filter="url(#shadow)">
    <rect width="790" height="120" rx="16" fill="url(#dbAtlasGrad)" stroke="#00ed64" stroke-width="1.8" />
    <text x="395" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">
      MongoDB Atlas (Cloud Cluster) / MongoDB 6.0 Container
    </text>
    <text x="395" y="55" text-anchor="middle" font-size="12" fill="#d1fae5">
      Database-Per-Service Pattern • Independent Data Stores &amp; Complete Schema Isolation
    </text>

    <!-- DB Cards -->
    <rect x="40" y="68" width="210" height="38" rx="8" fill="#023425" />
    <text x="145" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6ee7b7">campus_users</text>
    <text x="145" y="99" text-anchor="middle" font-size="9.5" fill="#a7f3d0">User Service Data</text>

    <rect x="290" y="68" width="210" height="38" rx="8" fill="#023425" />
    <text x="395" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6ee7b7">campus_products</text>
    <text x="395" y="99" text-anchor="middle" font-size="9.5" fill="#a7f3d0">Product Service Data</text>

    <rect x="540" y="68" width="210" height="38" rx="8" fill="#023425" />
    <text x="645" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6ee7b7">campus_orders</text>
    <text x="645" y="99" text-anchor="middle" font-size="9.5" fill="#a7f3d0">Order Service Data</text>
  </g>

  <!-- DB Connection Lines -->
  <path d="M 220 525 L 220 620 L 325 620 L 325 710" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 555 525 L 555 710" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-purple)" />
  <path d="M 890 525 L 890 620 L 785 620 L 785 710" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-pink)" />
</svg>
