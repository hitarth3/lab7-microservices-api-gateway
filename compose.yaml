# ==============================================================================
# Lab 7: Docker Compose Microservices Architecture Specification
# API Gateway, Service Discovery, and Cloud/Container Deployment
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. API Gateway (Port 8080 - ONLY Port Exposed Externally to the Host/Internet)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:v1
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3001}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3002}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:3003}
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network

  # ----------------------------------------------------------------------------
  # 2. User Microservice (Port 3001 - Internal to campus-network ONLY)
  # ----------------------------------------------------------------------------
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: user-service:v1
    container_name: user-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/campus_users}
    depends_on:
      - mongodb
    networks:
      - campus-network

  # ----------------------------------------------------------------------------
  # 3. Product Microservice (Port 3002 - Internal to campus-network ONLY)
  # ----------------------------------------------------------------------------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: product-service:v1
    container_name: product-service
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/campus_products}
    depends_on:
      - mongodb
    networks:
      - campus-network

  # ----------------------------------------------------------------------------
  # 4. Order Microservice (Port 3003 - Internal to campus-network ONLY)
  # ----------------------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: order-service:v1
    container_name: order-service
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/campus_orders}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3001}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3002}
      CALL_TIMEOUT_MS: ${CALL_TIMEOUT_MS:-3000}
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - campus-network

  # ----------------------------------------------------------------------------
  # 5. Database Service (MongoDB - Internal to campus-network ONLY)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: campus-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network

# ------------------------------------------------------------------------------
# Shared Bridge Network for Container-to-Container DNS Resolution
# Microservices communicate using Compose service names (e.g. user-service:3001)
# ------------------------------------------------------------------------------
networks:
  campus-network:
    name: campus-network

# ------------------------------------------------------------------------------
# Named Persistent Storage Volume
# Stores isolated database files across container restarts
# ------------------------------------------------------------------------------
volumes:
  campus-mongo-data:
    name: campus-mongo-data
